services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: magnus
      POSTGRES_DB: magnus_dev
    ports:
      - "5432:5432"
    volumes:
      - magnus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnus -d magnus_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  magnus_pg_data:
